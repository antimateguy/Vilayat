# Serves the static export of the frontend inside the "frontend" container.
server {
    listen 3000;
    root /usr/share/nginx/html;

    # The export writes one file per page: /compare is compare.html.
    # Pages are checked with the server on every visit ("no-cache" means
    # revalidate, not "never store"), so a rebuilt site shows up on the next
    # load instead of an old copy from the browser's cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # The map library loads its worker as a JavaScript module (.mjs). Browsers
    # refuse a module that is not labelled as JavaScript, and nginx does not
    # know this file ending by default; without this the map stays blank.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
    }

    # Built files carry a hash in their name, so they can be cached for good.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
