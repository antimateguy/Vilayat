[project]
name = "educommute-backend"
version = "0.1.0"
description = "EduCommute Matrix API and offline jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "geoalchemy2>=0.20.0",
    "google-genai>=2.28.0",
    "h3>=4.5.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    # Tests exercise the offline jobs, so development installs their dependencies too.
    { include-group = "jobs" },
]
# Needed only by the evaluation (backend/evaluation): local embedding models (PyTorch),
# Jupyter and charts. Large; installed on request: uv run --group eval ...
eval = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "sentence-transformers>=6.1.0",
]
# Needed only by the offline jobs. The production image installs with --no-dev,
# which leaves this group out.
jobs = [
    "shapely>=2.1.2",
]
# Needed only by the travel-time job (jobs.build_travel_times). Large, and needs
# Java 21, so it is installed on request: uv run --group routing ...
routing = [
    "geopandas>=1.2.0",
    "r5py>=1.1.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, modern syntax, naming, simplifications
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
# The architecture layers are top-level packages of this project.
known-first-party = ["api", "domain", "services", "ports", "infrastructure", "cities", "jobs", "evaluation", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ['^\.venv/']

[[tool.mypy.overrides]]
# These libraries ship no type information.
module = ["h3.*", "shapely.*", "r5py.*", "geopandas.*", "sentence_transformers.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the Compose database to be running (docker compose up -d db)",
]
