# Render Blueprint for the API (free plan). Create it in the Render dashboard:
# New > Blueprint > this repository. Values marked `sync: false` are asked for
# in the dashboard and are never stored in the repository.
services:
  - type: web
    name: vilayat-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    # The liveness check does not touch the database, so Render's checks do
    # not keep the free Neon database awake.
    healthCheckPath: /health/live
    # Deploy only after the GitHub Actions checks of the commit have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
