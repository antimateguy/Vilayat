# Local stack: database, backend and frontend. `docker compose up -d` starts
# all three; the site is then at http://localhost:3000. Values come from .env
# when it exists; the defaults below let it work without one.
name: educommute

services:
  db:
    build: ./db
    image: educommute-db:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-educommute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educommute_dev}
      POSTGRES_DB: ${POSTGRES_DB:-educommute}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # The prepared data, loaded on the first start of an empty volume.
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    image: educommute-backend:dev
    environment:
      # Inside the Compose network the database host is the service name "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-educommute}:${POSTGRES_PASSWORD:-educommute_dev}@db:5432/${POSTGRES_DB:-educommute}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Empty means the AI features are switched off.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # The built static site, served by nginx. After changing frontend code:
  #   docker compose up -d --build frontend
  # For live reload while editing, stop this service and run `pnpm dev` instead.
  frontend:
    build:
      context: ./frontend
      args:
        # The browser, not this container, calls the API, so this is the
        # address as seen from the host.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        # Optional: an address to show on the Contact page.
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    image: educommute-frontend:dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
